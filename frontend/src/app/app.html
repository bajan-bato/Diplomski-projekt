<div class="app-shell">
  <button
    type="button"
    class="hamburger"
    (click)="toggleDrawer()"
    [attr.aria-expanded]="drawerOpen()"
    aria-controls="main-nav"
    aria-label="Otvori ili zatvori navigaciju"
  >
    <span class="hamburger__bar"></span>
    <span class="hamburger__bar"></span>
    <span class="hamburger__bar"></span>
  </button>

  <h1 class="app-shell__title">Pregled analiza</h1>

  @if (drawerOpen()) {
    <div class="backdrop" (click)="closeDrawer()"></div>
  }

  <nav id="main-nav" class="drawer" [class.drawer--open]="drawerOpen()" aria-label="Navigacija">
    <h2 class="drawer__heading">Navigacija</h2>
    <a routerLink="/packages" routerLinkActive="active" (click)="closeDrawer()">Paketi</a>
    <a routerLink="/statistics" routerLinkActive="active" (click)="closeDrawer()">Statistika</a>
  </nav>

  <main class="app-shell__content">
    <router-outlet />
  </main>
</div>
